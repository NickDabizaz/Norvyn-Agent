name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install chromium
      - name: Verify requested version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne '${{ inputs.version }}') {
            throw "package.json version $packageVersion does not match requested version ${{ inputs.version }}"
          }
      - run: npm run verify
      - run: npm pack --dry-run
      - name: Publish package if needed
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $published = npm view "norvyn@$version" version 2>$null
          if ($LASTEXITCODE -eq 0 -and $published.Trim() -eq $version) {
            Write-Host "norvyn@$version is already published; continuing recovery."
          } else {
            npm publish
            if ($LASTEXITCODE -ne 0) { throw "npm publish failed" }
          }
      - name: Create Git tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists; release workflow is complete."
          } else {
            gh release create $tag --target "${{ github.sha }}" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }
          }
