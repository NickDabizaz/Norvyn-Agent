name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install chromium
      - name: Verify requested version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne '${{ inputs.version }}') {
            throw "package.json version $packageVersion does not match requested version ${{ inputs.version }}"
          }
      - run: npm run verify
      - run: npm pack --dry-run
      - run: npm publish
